<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ultraslop Constructor</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: radial-gradient(1200px 600px at 20% 0%, #1a2440 0%, #0b0b0f 60%, #08080c 100%);
      color: #f5f5f5;
      font-family: "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-rows: 80px 1fr 140px;
      height: 100%;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: linear-gradient(120deg, #1b2a4d, #2a2f5b);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      border-bottom: 1px solid rgba(125, 170, 255, 0.15);
    }
    .title {
      font-size: 18px;
      letter-spacing: 1px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .status {
      font-size: 12px;
      opacity: 0.7;
    }
    .content {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      padding: 24px;
    }
    .panel {
      background: rgba(10,14,28,0.85);
      border: 1px solid rgba(125, 170, 255, 0.2);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .output {
      height: 100%;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 13px;
      line-height: 1.6;
    }
    .input {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    textarea {
      height: 120px;
      background: #0d1222;
      border: 1px solid rgba(125, 170, 255, 0.35);
      border-radius: 12px;
      color: #fff;
      padding: 12px;
      resize: none;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background: #0c1020;
      border-top: 1px solid rgba(125, 170, 255, 0.15);
    }
    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #7db0ff;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .ghost {
      opacity: 0.5;
      font-style: italic;
    }
    .popup {
      position: fixed;
      min-width: 220px;
      max-width: 320px;
      padding: 14px 16px;
      background: rgba(20, 28, 52, 0.95);
      border: 1px solid rgba(125, 170, 255, 0.35);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
      color: #dfe7ff;
      font-size: 12px;
      z-index: 9999;
    }
    .popup-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="title">Ultraslop Constructor</div>
      <div class="status" id="status">Initializing services...</div>
    </div>
    <div class="content">
      <div class="panel">
        <div class="output" id="output"></div>
      </div>
      <div class="panel input">
        <label>Session Input</label>
        <textarea id="prompt" placeholder="Enter request"></textarea>
        <div class="ghost">Calibrating inference…</div>
        <div class="ghost">Synchronizing context…</div>
      </div>
    </div>
    <div class="footer">
      <div>Model: ckpt.pt (CPU)</div>
      <div class="spinner"></div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
